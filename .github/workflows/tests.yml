name: Pruebas automatizadas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependencias
        run: dotnet restore tests/CacaoTrigo.Tests/CacaoTrigo.Tests.csproj

      - name: Ejecutar pruebas
        run: dotnet test tests/CacaoTrigo.Tests/CacaoTrigo.Tests.csproj --no-restore --configuration Release
