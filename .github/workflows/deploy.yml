name: Construir y publicar CacaoTrigo en ACR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cacaotrigo-production
  cancel-in-progress: true

env:
  AZURE_CONTAINER_REGISTRY: cacaotrigoacrjgiron26
  AZURE_RESOURCE_GROUP: cacaotrigo-jgiron-scus-2026
  AZURE_CONTAINER_APP: cacaotrigo-api
  IMAGE_NAME: cacaotrigo-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en Azure con OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Iniciar sesión en Azure Container Registry
        run: az acr login --name "$AZURE_CONTAINER_REGISTRY"

      - name: Construir y publicar la imagen
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --pull --platform linux/amd64 \
            --tag "$AZURE_CONTAINER_REGISTRY.azurecr.io/$IMAGE_NAME:$IMAGE_TAG" .
          docker push "$AZURE_CONTAINER_REGISTRY.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"

      - name: Preparar Azure Container Apps CLI
        run: az extension add --name containerapp --upgrade

      - name: Actualizar la aplicación en Azure
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$AZURE_CONTAINER_REGISTRY.azurecr.io/$IMAGE_NAME:$IMAGE_TAG" \
            --only-show-errors
